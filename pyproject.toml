[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "synty-inventory"
version = "0.1.0"
description = "Offline scanner and query CLI for Synty Unity/Unreal pack catalogs"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Tom Swift", email = "tom@swiftinnovate.tech" }]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
synty-inventory = "synty_inventory.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
synty_inventory = ["config.example.yaml", "skill.md", "recipes/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
