[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "synty-inventory"
version = "0.1.0"
description = "Offline scanner and query CLI for Synty Unity/Unreal pack catalogs"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Tom Swift", email = "tom@swiftinnovate.tech" }]
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "jsonschema>=4.17",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
synty-inventory = "synty_inventory.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
synty_inventory = ["config.example.yaml", "skill.md", "recipes/*.json", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "live: needs licensed Synty trees on this machine (skipped in CI)",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
    "E501",  # long recipe/knowledge strings
    "B007",  # unused loop vars in existing recipe conversion
    "B905",  # zip() without strict= — pre-existing
]
