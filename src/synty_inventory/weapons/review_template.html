<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weapon directory review</title>
<style>
:root { --bg:#14171c; --card:#1e232b; --card2:#272d37; --line:#394150; --fg:#e6e9ef; --dim:#9aa4b5; --acc:#6cb6ff;
  --ok:#5ec27a; --warn:#e8b04a; --bad:#ec6a6a; }
* { box-sizing:border-box; }
html, body { margin:0; padding:0; background:var(--bg); color:var(--fg); font:15px/1.35 system-ui, sans-serif; }
body { padding:0 10px 90px; max-width:100%; overflow-x:hidden; }
body.panel-open { padding-bottom:70vh; }
header { position:sticky; top:0; z-index:5; background:var(--bg); padding:8px 0 6px; border-bottom:1px solid var(--line); }
h1 { font-size:18px; margin:0 0 4px; }
.sub { color:var(--dim); font-size:13px; }
.bar { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; align-items:center; }
.bar input[type=search] { flex:1 1 140px; min-width:0; padding:8px; border-radius:6px; border:1px solid var(--line);
  background:var(--card); color:var(--fg); font-size:15px; }
button, select, textarea { font:inherit; }
button { padding:8px 12px; border-radius:6px; border:1px solid var(--line); background:var(--card2); color:var(--fg);
  cursor:pointer; min-height:38px; }
button.primary { background:#2b5d96; border-color:#3d7bc0; }
button.good { background:#25663a; border-color:#34864e; }
button.bad { background:#7a2c2c; border-color:#9c3c3c; }
button:focus-visible, .tile:focus-visible, summary:focus-visible { outline:2px solid var(--acc); outline-offset:1px; }
nav.jump { display:flex; flex-wrap:wrap; gap:4px 10px; margin:6px 0 0; font-size:13px; }
nav.jump a { color:var(--acc); text-decoration:none; }
nav.jump .zero { color:var(--dim); }
section.sec { margin-top:16px; }
section.sec h2 { font-size:16px; margin:0 0 8px; padding-bottom:4px; border-bottom:1px solid var(--line); }
section.sec h2 .n { color:var(--dim); font-weight:normal; font-size:13px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:8px; }
.empty { color:var(--dim); font-size:13px; margin:0; }
.tile { display:flex; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px;
  min-width:0; cursor:pointer; }
.tile.sel { border-color:var(--acc); box-shadow:0 0 0 1px var(--acc); }
.tile.pending { border-color:var(--warn); }
.tile.hide, details.family.hide { display:none; }
.thumb { flex:0 0 64px; width:64px; height:64px; border-radius:4px; background:#0d0f13; object-fit:contain; }
.thumb.none { display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:11px; text-align:center; }
.meta { min-width:0; flex:1 1 auto; }
.id { font-size:13px; font-weight:600; word-break:break-all; overflow-wrap:anywhere; }
.line { display:flex; flex-wrap:wrap; gap:4px; margin-top:3px; font-size:12px; }
.tag { background:var(--card2); border-radius:4px; padding:1px 6px; }
.tag.arch { color:var(--acc); }
.tag.role { color:#c9a7ff; }
.tag.conf-low { color:var(--bad); }
.tag.conf-mid { color:var(--warn); }
.tag.conf-ok { color:var(--ok); }
.tag.status-reviewed, .tag.status-overridden { color:var(--ok); }
.tag.reason { color:var(--warn); }
.tag.pend { background:#5a4513; color:#ffd98a; }
.flags { color:var(--dim); font-size:11px; margin-top:2px; overflow-wrap:anywhere; }
details.family { grid-column:1 / -1; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:4px; }
details.family > summary { cursor:pointer; padding:6px; list-style:none; display:flex; flex-wrap:wrap; gap:6px;
  align-items:center; font-weight:600; }
details.family > summary::-webkit-details-marker { display:none; }
details.family > summary::before { content:"+"; display:inline-block; width:16px; color:var(--acc); }
details.family[open] > summary::before { content:"-"; }
details.family .count { background:#2b5d96; border-radius:10px; padding:0 8px; }
details.family .of { color:var(--warn); font-weight:normal; font-size:13px; }
details.family .grid { margin-top:6px; }
#panel { position:fixed; left:0; right:0; bottom:0; z-index:10; background:#1a1f27; border-top:2px solid var(--acc);
  max-height:68vh; overflow-y:auto; padding:10px 12px 14px; box-shadow:0 -6px 18px rgba(0,0,0,.5); }
#panel[hidden] { display:none; }
#panel h3 { margin:0 0 2px; font-size:15px; word-break:break-all; overflow-wrap:anywhere; }
#panel .info { color:var(--dim); font-size:12px; margin-bottom:6px; overflow-wrap:anywhere; }
#panel .fields { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:6px 8px; }
#panel label { display:flex; flex-direction:column; font-size:12px; color:var(--dim); min-width:0; }
#panel select { margin-top:2px; padding:7px; border-radius:6px; border:1px solid var(--line); background:var(--card);
  color:var(--fg); min-width:0; width:100%; }
#panel .row { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; align-items:center; }
#panel .fam { margin-top:8px; font-size:13px; display:flex; flex-direction:row; gap:6px; align-items:flex-start; color:var(--fg); }
#panel .fam input { margin:3px 0 0; width:auto; flex:none; }
#panel .fam > span { flex:1; min-width:0; overflow-wrap:anywhere; }
#panel textarea { width:100%; margin-top:8px; min-height:44px; padding:7px; border-radius:6px; background:var(--card);
  color:var(--fg); border:1px solid var(--line); }
#panel .state { margin-top:6px; font-size:12px; color:var(--warn); }
#panel .close { float:right; }
#msg { color:var(--ok); font-size:13px; min-height:1.2em; }
details.raw { margin-top:16px; }
details.raw textarea { width:100%; min-height:120px; background:var(--card); color:var(--fg); border:1px solid var(--line);
  border-radius:6px; padding:6px; font:12px/1.3 monospace; }
section.sec h3.slot { font-size:14px; margin:12px 0 6px; color:var(--acc); }
section.sec h3.slot .n { color:var(--dim); font-weight:normal; font-size:12px; }
.tag.slot { color:#7fe0c8; }
.tag.akind { color:#e0c87f; }
.tag.tier { color:var(--dim); }
.reasons { color:var(--warn); font-size:11px; margin-top:2px; overflow-wrap:anywhere; }
.pvs { display:flex; gap:4px; margin-top:4px; flex-wrap:wrap; }
img.pv { width:96px; height:96px; object-fit:contain; background:#0d0f13; border-radius:4px; }
button.chip { min-height:30px; padding:4px 10px; border-radius:15px; font-size:13px; }
button.chip.on { background:#7a5a13; border-color:#c99a2e; }
.bar label.chk { display:flex; align-items:center; gap:4px; font-size:13px; color:var(--dim); }
#panel h4 { margin:10px 0 4px; font-size:13px; color:var(--dim); font-weight:600; }
#panel .hosts { display:flex; flex-direction:column; gap:3px; max-height:30vh; overflow-y:auto; }
#panel label.hrow { flex-direction:row; flex-wrap:wrap; align-items:center; gap:6px; background:var(--card); border-radius:6px;
  padding:3px 6px; color:var(--fg); }
#panel label.hrow.dim, #panel tr.dim { opacity:.55; }
#panel label.hrow input[type=checkbox] { width:auto; margin:0; }
#panel .hid { font-size:12px; overflow-wrap:anywhere; flex:1 1 160px; }
#panel .score { font-size:12px; color:var(--ok); }
#panel .tag.nm { background:#3a3a3a; color:var(--dim); }
#panel .hstate.inferred { color:var(--dim); font-size:11px; }
#panel .hstate.added { color:var(--ok); font-size:11px; }
#panel .hstate.removed { color:var(--bad); font-size:11px; }
#panel .hosts select.lab { width:auto; margin:0; padding:3px; }
#panel input[type=text] { flex:1 1 160px; min-width:0; padding:7px; border-radius:6px; border:1px solid var(--line);
  background:var(--card); color:var(--fg); }
#panel table { width:100%; border-collapse:collapse; font-size:12px; }
#panel th, #panel td { text-align:left; padding:3px 4px; border-bottom:1px solid var(--line); vertical-align:top; overflow-wrap:anywhere; }
#panel td select { margin:0; padding:3px; }
@media (min-width: 900px) {
  body { padding-bottom:30px; }
  body.panel-open { padding-bottom:30px; padding-right:372px; }
  #panel { left:auto; top:0; width:360px; max-height:none; border-top:0; border-left:2px solid var(--acc); }
}
</style>
</head>
<body data-state-key="@@STATE_KEY@@">
<header>
  <h1>Weapon directory review</h1>
  <div class="sub">@@SUMMARY@@</div>
  <div class="bar">
    <input id="q" type="search" placeholder="Filter by id" aria-label="Filter tiles by id">
    <button id="dl" class="primary" type="button">Download corrections.json</button>
    <button id="cp" type="button">Copy to clipboard</button>
    <button id="f-nomount" class="chip" type="button" aria-pressed="false" title="Hosts whose mount is missing (review reason mount_missing)">No mount (@@NOMOUNT@@)</button>
    <label class="chk"><input id="c-label" type="checkbox"> Label mode</label>
    <button id="dl-labels" type="button" hidden>Download weapon_attach_labels.json</button>
    <span id="msg" role="status"></span>
  </div>
  <nav class="jump">@@NAV@@</nav>
</header>
<main>
@@SECTIONS@@
</main>
<details class="raw"><summary>Corrections JSON (<span id="pcount">0</span> pending; <span id="lcount">0</span> labelled pairs)</summary>
  <textarea id="raw" readonly rows="8" aria-label="Corrections JSON"></textarea>
</details>
<aside id="panel" hidden aria-label="Correction panel">
  <button id="close" class="close" type="button">Close</button>
  <h3 id="p-id"></h3>
  <div class="info" id="p-info"></div>
  <div class="fields">
    <label>role<select id="f-role"></select></label>
    <label>kind<select id="f-kind"></select></label>
    <label>archetype<select id="f-archetype"></select></label>
    <label>hold_class<select id="f-hold_class"></select></label>
    <label>genre<select id="f-genre"></select></label>
    <label id="l-carrier" hidden>carrier kind<select id="f-carrier"></select></label>
    <label id="l-ammo" hidden>projectile<select id="f-ammo"></select></label>
  </div>
  <div id="att" hidden>
    <h4>Attachment</h4>
    <div class="fields">
      <label>attachment slot<select id="f-aslot"></select></label>
      <label>attachment kind<select id="f-akind"></select></label>
    </div>
    <div class="row"><button id="b-flip" type="button">Flip forward</button><span class="sub" id="p-flip"></span></div>
    <h4>Hosts <span id="p-hostn"></span></h4>
    <div class="hosts" id="hosts"></div>
    <div class="row"><input id="h-add" type="text" placeholder="Add a host: pack/asset_id or pack/glob*" aria-label="Add a host id or glob"><button id="b-hadd" type="button">Add</button></div>
  </div>
  <div id="mnt" hidden>
    <h4>Mounts</h4>
    <table id="mounts" aria-label="Mounts"></table>
  </div>
  <div class="row">
    <button id="b-ok" class="good" type="button">Mark correct</button>
    <button id="b-no" class="bad" type="button">Not a weapon</button>
    <button id="b-restore" class="good" type="button">Restore</button>
    <button id="b-clear" type="button">Clear</button>
  </div>
  <label class="fam" id="l-fam"><input id="c-fam" type="checkbox"><span id="p-fam">Apply to family</span></label>
  <textarea id="note" placeholder="Note (optional)" aria-label="Note"></textarea>
  <div class="state" id="p-state"></div>
</aside>
<script type="application/json" id="enums">@@ENUMS@@</script>
<script type="application/json" id="attach-data">@@ATTACH@@</script>
<script>
(function () {
  'use strict';
  var ENUMS = JSON.parse(document.getElementById('enums').textContent);
  var DATA = JSON.parse(document.getElementById('attach-data').textContent);
  var FIELDS = ['role', 'kind', 'archetype', 'hold_class', 'genre'];
  var ATTACH_KEYS = ['attachment_slot', 'attachment_kind'];
  var KEY = 'weapon-corrections/1:' + (document.body.getAttribute('data-state-key') || '');
  var LABEL_KEY = 'weapon-attach-labels/1:' + (document.body.getAttribute('data-state-key') || '');

  // localStorage is optional: a blocked or full store falls back to memory and the page still works.
  var store = null;
  try { store = window.localStorage; store.setItem('__t', '1'); store.removeItem('__t'); } catch (e) { store = null; }
  function load(key) {
    try { var raw = store ? store.getItem(key) : null; var o = raw ? JSON.parse(raw) : {}; return o && typeof o === 'object' ? o : {}; }
    catch (e) { return {}; }
  }
  function persist() {
    if (store) {
      try { store.setItem(KEY, JSON.stringify(state)); store.setItem(LABEL_KEY, JSON.stringify(labels)); } catch (e) { /* quota */ }
    }
  }

  // state: tile id -> {scope: 'id'|'family', set: {}, confirm: bool, exclude: bool, note: string,
  //                    hosts: {host: 'remove'}, addIds: [host id or glob], flip: bool, mounts: {slot: 'none'|node}}
  // labels (Label mode): part id -> {host id: true|false}
  var state = load(KEY);
  var labels = load(LABEL_KEY);
  var tiles = {};
  var all = document.querySelectorAll('.tile[data-id]');
  for (var i = 0; i < all.length; i++) { tiles[all[i].getAttribute('data-id')] = all[i]; }
  var cur = null;

  function el(id) { return document.getElementById(id); }
  function fill(select, values, blankLabel) {
    select.textContent = '';
    var o = document.createElement('option'); o.value = ''; o.textContent = blankLabel; select.appendChild(o);
    values.forEach(function (v) { var x = document.createElement('option'); x.value = v; x.textContent = v; select.appendChild(x); });
  }
  FIELDS.forEach(function (f) { fill(el('f-' + f), ENUMS[f], '(unchanged)'); });
  fill(el('f-carrier'), ENUMS.carrier, '(choose)');
  fill(el('f-ammo'), ENUMS.ammo, '(choose)');
  fill(el('f-aslot'), DATA.slots, '(unchanged)');

  function isEmpty(o) { for (var k in o) { if (Object.prototype.hasOwnProperty.call(o, k)) { return false; } } return true; }
  function listOf(o) { return Array.isArray(o) ? o : []; }

  // --- attachment extras of one state entry -------------------------------------------------------------
  // compatible {add, remove}: a host row of the checklist that is unticked is a removal; a typed id or glob is an addition.
  function compatOf(s) {
    var add = listOf(s.addIds).slice(), remove = [];
    Object.keys(s.hosts || {}).sort().forEach(function (h) { if (s.hosts[h] === 'remove') { remove.push(h); } });
    add = add.filter(function (h, i) { return add.indexOf(h) === i; }).sort();
    if (!add.length && !remove.length) { return null; }
    var o = {};
    if (add.length) { o.add = add; }
    if (remove.length) { o.remove = remove; }
    return o;
  }
  // mounts {slot: {source: 'none'} | {source: 'child_node', child: node}}: categorical only, never a number
  function mountsOf(s) {
    var m = s.mounts || {}, out = {}, any = false;
    DATA.slots.forEach(function (slot) {
      if (!m[slot]) { return; }
      out[slot] = m[slot] === 'none' ? { source: 'none' } : { source: 'child_node', child: m[slot] };
      any = true;
    });
    return any ? out : null;
  }
  function flipTo(t) { return t.getAttribute('data-flipto') || ''; }
  function hasExtras(s) {
    return !!(compatOf(s) || s.flip || mountsOf(s));
  }
  function isPending(s) {
    return !!(s && (!isEmpty(s.set || {}) || s.confirm || s.exclude || hasExtras(s)));
  }

  // The corrections file (weapon-corrections/1) built from the pending state; sorted by target so it is stable.
  // `forward` and `mounts` are exact-id only (a glob target is exit 6), so a family correction writes them as a
  // separate entry for the tile's own id.
  function buildCorrections() {
    var byTarget = {};
    Object.keys(state).sort().forEach(function (id) {
      var s = state[id], t = tiles[id];
      if (!t || !s) { return; }
      var family = s.scope === 'family' && t.getAttribute('data-glob') && !t.hasAttribute('data-excluded');
      var target = family ? { glob: t.getAttribute('data-glob') } : { id: id };
      var sset = s.set || {};
      if ((sset.role === 'carrier' && !sset.carrier) || (sset.role === 'ammo' && !sset.ammo)) { return; }  // incomplete
      var c = { target: target };
      var idOnly = {};
      var comp = s.exclude ? null : compatOf(s);
      if (s.exclude) { c.exclude = true; }
      else if (!isEmpty(sset)) { c.set = sset; }
      else if (s.confirm || !hasExtras(s)) { c.confirm = true; }
      if (comp) { c.compatible = comp; }
      if (!s.exclude && s.flip && flipTo(t)) { idOnly.forward = flipTo(t); }
      var mnt = s.exclude ? null : mountsOf(s);
      if (mnt) { idOnly.mounts = mnt; }
      var shared = !!(c.exclude || c.set || c.confirm || c.compatible);
      var hasOnly = !isEmpty(idOnly);
      if (family) {
        if (shared) {
          if (s.note) { c.note = s.note; }
          byTarget[JSON.stringify(target)] = c;
        }
        if (hasOnly) {
          var d = { target: { id: id } };
          Object.keys(idOnly).forEach(function (k) { d[k] = idOnly[k]; });
          if (!shared && s.note) { d.note = s.note; }
          byTarget[JSON.stringify(d.target)] = d;
        }
      } else {
        Object.keys(idOnly).forEach(function (k) { c[k] = idOnly[k]; });
        if (s.note) { c.note = s.note; }
        if (shared || hasOnly) { byTarget[JSON.stringify(target)] = c; }
      }
    });
    return { schema: 'weapon-corrections/1', corrections: Object.keys(byTarget).sort().map(function (k) { return byTarget[k]; }) };
  }
  window.__buildCorrections = buildCorrections;

  // Label mode output (weapon-attach-labels/1): ids and booleans only, one entry per (part, host), sorted.
  function buildLabels() {
    var pairs = [];
    Object.keys(labels).sort().forEach(function (part) {
      Object.keys(labels[part] || {}).sort().forEach(function (host) {
        if (typeof labels[part][host] === 'boolean') { pairs.push({ part: part, host: host, fits: labels[part][host] }); }
      });
    });
    return { schema: 'weapon-attach-labels/1', pairs: pairs };
  }
  window.__buildLabels = buildLabels;

  function stateLabel(s, t) {
    var label = s.exclude ? 'not a weapon' : (!isEmpty(s.set || {}) ? 'changed' : (t.hasAttribute('data-excluded') ? 'restore' : 'correct'));
    if (!s.exclude && isEmpty(s.set || {}) && !s.confirm && hasExtras(s)) {
      var bits = [];
      if (compatOf(s)) { bits.push('hosts'); }
      if (s.flip) { bits.push('flip'); }
      if (mountsOf(s)) { bits.push('mounts'); }
      label = bits.join(' + ');
    }
    if (s.scope === 'family') { label += ' (family)'; }
    return label;
  }

  function render() {
    var n = 0;
    Object.keys(tiles).forEach(function (id) {
      var t = tiles[id], s = state[id], tag = t.querySelector('.pend');
      if (s) {
        n++;
        t.classList.add('pending');
        if (!tag) { tag = document.createElement('span'); tag.className = 'tag pend'; t.querySelector('.line').appendChild(tag); }
        tag.textContent = stateLabel(s, t);
      } else {
        t.classList.remove('pending');
        if (tag) { tag.parentNode.removeChild(tag); }
      }
    });
    el('pcount').textContent = String(n);
    el('raw').value = JSON.stringify(buildCorrections(), null, 1);
    el('lcount').textContent = String(buildLabels().pairs.length);
    persist();
  }

  // --- the attachment panel -----------------------------------------------------------------------------
  function curSlot(t) {
    var s = state[cur];
    return (s && s.set && s.set.attachment_slot) || t.getAttribute('data-slot');
  }
  function fillKinds(t) {
    var slot = curSlot(t), s = state[cur];
    fill(el('f-akind'), DATA.kinds[slot] || [], '(unchanged)');
    el('f-akind').value = (s && s.set && s.set.attachment_kind) || '';
  }
  function setAttachPanel(t) {
    var is = t.hasAttribute('data-attach');
    el('att').hidden = !is;
    if (!is) { return; }
    var s = state[cur] || { set: {} };
    el('f-aslot').value = (s.set && s.set.attachment_slot) || '';
    fillKinds(t);
    var to = flipTo(t);
    el('b-flip').hidden = !to;
    el('b-flip').textContent = s.flip ? 'Undo flip' : 'Flip forward';
    el('p-flip').textContent = to ? ('forward ' + t.getAttribute('data-flipfrom') + (s.flip ? ' -> ' + to + ' (pending)' : ' (measured)')) : 'no measured anchor: nothing to flip';
    renderHosts(t);
  }

  function hostRow(t, h, extra) {
    var s = state[cur] || {};
    var row = document.createElement('label');
    row.className = 'hrow' + (h.pending ? ' dim' : '');
    var box = document.createElement('input'); box.type = 'checkbox';
    var removed = !extra && s.hosts && s.hosts[h.host] === 'remove';
    box.checked = !removed;
    box.addEventListener('change', function () { toggleHost(h.host, !!extra, box.checked); });
    var name = document.createElement('span'); name.className = 'hid'; name.textContent = h.host;
    row.appendChild(box); row.appendChild(name);
    var tier = document.createElement('span'); tier.className = 'tag tier'; tier.textContent = h.tier || 'added'; row.appendChild(tier);
    if (h.score !== null && h.score !== undefined) {
      var sc = document.createElement('span'); sc.className = 'score'; sc.textContent = Number(h.score).toFixed(2); row.appendChild(sc);
    }
    if (h.pending) { var nm = document.createElement('span'); nm.className = 'tag nm'; nm.textContent = 'no mount'; row.appendChild(nm); }
    var st = document.createElement('span'); st.className = 'hstate ' + (extra ? 'added' : (removed ? 'removed' : 'inferred'));
    st.textContent = extra ? 'added' : (removed ? 'removed' : 'inferred');
    row.appendChild(st);
    if (h.preview) {
      var img = document.createElement('img'); img.className = 'pv'; img.src = h.preview; img.width = 96; img.height = 96; img.alt = '';
      row.appendChild(img);
    }
    if (el('c-label').checked && !extra) {
      var lab = document.createElement('select'); lab.className = 'lab'; lab.setAttribute('aria-label', 'label ' + h.host);
      [['', 'unlabelled'], ['1', 'fits'], ['0', 'does not fit']].forEach(function (p) {
        var o = document.createElement('option'); o.value = p[0]; o.textContent = p[1]; lab.appendChild(o);
      });
      var have = labels[cur] && labels[cur][h.host];
      lab.value = have === true ? '1' : (have === false ? '0' : '');
      lab.addEventListener('click', function (ev) { ev.stopPropagation(); });
      lab.addEventListener('change', function () { setLabel(h.host, lab.value); });
      row.appendChild(lab);
    }
    return row;
  }
  function renderHosts(t) {
    var box = el('hosts'), s = state[cur] || {};
    box.textContent = '';
    var info = DATA.attachments[cur];
    var rows = info ? info.hosts : [];
    rows.forEach(function (h) { box.appendChild(hostRow(t, h, false)); });
    listOf(s.addIds).forEach(function (id) { box.appendChild(hostRow(t, { host: id, tier: null, score: null, pending: false, preview: null }, true)); });
    el('p-hostn').textContent = '(' + rows.filter(function (h) { return !h.pending; }).length + ' compatible, ' +
      rows.filter(function (h) { return h.pending; }).length + ' no mount)';
  }
  function toggleHost(host, isAdded, on) {
    if (!cur) { return; }
    var e = entry();
    if (isAdded) {
      if (!on) { e.addIds = listOf(e.addIds).filter(function (x) { return x !== host; }); }
    } else {
      e.hosts = e.hosts || {};
      if (on) { delete e.hosts[host]; } else { e.hosts[host] = 'remove'; }
    }
    settle();
  }
  function setLabel(host, value) {
    if (!cur) { return; }
    labels[cur] = labels[cur] || {};
    if (value === '') { delete labels[cur][host]; if (isEmpty(labels[cur])) { delete labels[cur]; } }
    else { labels[cur][host] = value === '1'; }
    render();
  }

  // --- the Mounts table of a host ----------------------------------------------------------------------------
  function setMountsPanel(t) {
    var info = t.hasAttribute('data-mounts') ? DATA.hosts[cur] : null;
    el('mnt').hidden = !info;
    var table = el('mounts');
    table.textContent = '';
    if (!info) { return; }
    var s = state[cur] || {}, picked = s.mounts || {};
    var head = document.createElement('tr');
    ['slot', 'source', 'occupied_by', 'confidence', 'seat'].forEach(function (h) {
      var th = document.createElement('th'); th.textContent = h; head.appendChild(th);
    });
    table.appendChild(head);
    DATA.slots.forEach(function (slot) {
      var m = info.mounts[slot];
      if (!m) { return; }
      var tr = document.createElement('tr');
      if (m.source === 'none') { tr.className = 'dim'; }
      [slot, m.source + (m.child ? ' (' + m.child + ')' : '') + (m.reason ? ': ' + m.reason : ''),
       m.occupied_by.length ? m.occupied_by.join(', ') : '-', m.confidence === null || m.confidence === undefined ? '-' : Number(m.confidence).toFixed(2)
      ].forEach(function (text) { var td = document.createElement('td'); td.textContent = text; tr.appendChild(td); });
      var td = document.createElement('td');
      var sel = document.createElement('select'); sel.className = 'mnt-pick'; sel.setAttribute('aria-label', 'mount ' + slot);
      var keep = document.createElement('option'); keep.value = ''; keep.textContent = '(unchanged)'; sel.appendChild(keep);
      var none = document.createElement('option'); none.value = 'none'; none.textContent = 'none'; sel.appendChild(none);
      info.nodes.forEach(function (n) { var o = document.createElement('option'); o.value = n; o.textContent = n; sel.appendChild(o); });
      sel.value = picked[slot] || '';
      sel.addEventListener('change', function () { pickMount(slot, sel.value); });
      td.appendChild(sel); tr.appendChild(td);
      table.appendChild(tr);
    });
  }
  function pickMount(slot, value) {
    if (!cur) { return; }
    var e = entry();
    e.mounts = e.mounts || {};
    if (value) { e.mounts[slot] = value; } else { delete e.mounts[slot]; }
    settle();
  }

  function setPanelValues(t) {
    var s = state[cur] || { set: {} };
    FIELDS.forEach(function (f) { el('f-' + f).value = (s.set && s.set[f]) || ''; });
    var role = (s.set && s.set.role) || t.getAttribute('data-role');
    el('l-carrier').hidden = role !== 'carrier';
    el('l-ammo').hidden = role !== 'ammo';
    el('f-carrier').value = (s.set && s.set.carrier) || '';
    el('f-ammo').value = (s.set && s.set.ammo) || '';
    el('note').value = s.note || '';
    el('c-fam').checked = !!(state[cur] && state[cur].scope === 'family');
    var excl = t.hasAttribute('data-excluded');
    el('b-ok').hidden = excl; el('b-no').hidden = excl; el('b-restore').hidden = !excl;
    el('l-fam').hidden = excl || !t.getAttribute('data-glob');
    FIELDS.forEach(function (f) { el('f-' + f).disabled = excl; });
    setAttachPanel(t);
    setMountsPanel(t);
    var st = state[cur];
    el('p-state').textContent = st && st.set && ((st.set.role === 'carrier' && !st.set.carrier) || (st.set.role === 'ammo' && !st.set.ammo))
      ? 'Choose the carrier kind / projectile: not emitted until then' : st ? ('Pending: ' + stateLabel(st, t) + (!isEmpty(st.set || {}) ? ' ' + JSON.stringify(st.set) : '')) : '';
  }

  function openPanel(id) {
    cur = id;
    var t = tiles[id];
    Array.prototype.forEach.call(document.querySelectorAll('.tile.sel'), function (x) { x.classList.remove('sel'); });
    t.classList.add('sel');
    el('p-id').textContent = id;
    var info = t.hasAttribute('data-excluded')
      ? 'Excluded: ' + t.getAttribute('data-reason') + ' (' + t.getAttribute('data-matched') + ')'
      : t.getAttribute('data-archetype') + ' / ' + t.getAttribute('data-genre') + ' / conf ' + t.getAttribute('data-conf') + ' / ' + t.getAttribute('data-status') + (t.getAttribute('data-reasons') ? ' / ' + t.getAttribute('data-reasons') : '');
    el('p-info').textContent = info;
    // The label text and N come from the page (data-famlabel): N is the number of ids the glob really matches in the
    // directory plus excluded rows, i.e. exactly what a family correction written from here applies to.
    var g = t.getAttribute('data-glob');
    el('p-fam').textContent = t.getAttribute('data-famlabel') || 'Apply to family';
    el('l-fam').title = g ? 'glob: ' + g : '';
    setPanelValues(t);
    el('panel').hidden = false;
    document.body.classList.add('panel-open');
  }
  function closePanel() {
    el('panel').hidden = true; cur = null;
    document.body.classList.remove('panel-open');
    Array.prototype.forEach.call(document.querySelectorAll('.tile.sel'), function (x) { x.classList.remove('sel'); });
  }

  function entry() {
    if (!state[cur]) {
      var fam = el('c-fam').checked && !tiles[cur].hasAttribute('data-excluded');
      state[cur] = { scope: fam ? 'family' : 'id', set: {}, confirm: false, exclude: false, note: '' };
    }
    return state[cur];
  }
  function after() { render(); if (cur) { setPanelValues(tiles[cur]); } }
  // drop an entry that no longer asks for anything, then redraw
  function settle() {
    if (cur && state[cur] && !isPending(state[cur])) { delete state[cur]; }
    after();
  }
  function note() { if (cur && state[cur]) { state[cur].note = el('note').value; } }

  function onField() {
    if (!cur) { return; }
    var e = entry(), t = tiles[cur];
    var keep = {};
    ATTACH_KEYS.forEach(function (k) { if (e.set && e.set[k]) { keep[k] = e.set[k]; } });
    e.set = {}; e.confirm = false; e.exclude = false;
    FIELDS.forEach(function (f) {
      var v = el('f-' + f).value;
      if (v && v !== t.getAttribute('data-' + f)) { e.set[f] = v; }
    });
    if (e.set.role === 'carrier' && el('f-carrier').value) { e.set.carrier = el('f-carrier').value; }
    if (e.set.role === 'ammo' && el('f-ammo').value) { e.set.ammo = el('f-ammo').value; }
    ATTACH_KEYS.forEach(function (k) { if (keep[k]) { e.set[k] = keep[k]; } });
    e.note = el('note').value;
    settle();
    // carrier/ammo need their sub-object before the correction is valid: keep the extra select in view
    var role = el('f-role').value;
    el('l-carrier').hidden = role !== 'carrier'; el('l-ammo').hidden = role !== 'ammo';
  }
  FIELDS.concat(['carrier', 'ammo']).forEach(function (f) { el('f-' + f).addEventListener('change', onField); });

  // slot / kind of an attachment: only a value that differs from the tile's own is written
  function onAttachField(key, select, tileAttr) {
    if (!cur) { return; }
    var e = entry(), t = tiles[cur];
    e.set = e.set || {};
    if (select.value && select.value !== t.getAttribute(tileAttr)) { e.set[key] = select.value; } else { delete e.set[key]; }
    if (key === 'attachment_slot') { delete e.set.attachment_kind; }  // the kinds belong to the slot: choose again
    settle();
  }
  el('f-aslot').addEventListener('change', function () { onAttachField('attachment_slot', el('f-aslot'), 'data-slot'); });
  el('f-akind').addEventListener('change', function () { onAttachField('attachment_kind', el('f-akind'), 'data-akind'); });
  el('b-flip').addEventListener('click', function () {
    if (!cur || !flipTo(tiles[cur])) { return; }
    var e = entry(); e.flip = !e.flip; settle();
  });
  function addHost() {
    if (!cur) { return; }
    var v = el('h-add').value.trim();
    if (!/^[^\/\s]+\/[^\s]+$/.test(v)) { el('p-state').textContent = 'A host is <pack>/<asset id or glob>'; return; }
    var e = entry();
    e.addIds = listOf(e.addIds);
    if (e.addIds.indexOf(v) < 0) { e.addIds.push(v); }
    el('h-add').value = '';
    settle();
  }
  el('b-hadd').addEventListener('click', addHost);
  el('h-add').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); addHost(); } });

  el('note').addEventListener('input', function () { note(); render(); });
  el('c-fam').addEventListener('change', function () {
    if (!cur) { return; }
    if (!state[cur]) { return; }
    state[cur].scope = el('c-fam').checked ? 'family' : 'id'; after();
  });
  function simple(kind) {
    if (!cur) { return; }
    var e = entry(); e.set = {}; e.confirm = kind !== 'no'; e.exclude = kind === 'no';
    if (kind === 'restore') { e.scope = 'id'; }  // a glob cannot restore: only an exact-id entry re-admits a rejected asset
    e.note = el('note').value;
    after();
  }
  el('b-ok').addEventListener('click', function () { simple('ok'); });
  el('b-no').addEventListener('click', function () { simple('no'); });
  el('b-restore').addEventListener('click', function () { simple('restore'); });
  el('b-clear').addEventListener('click', function () { if (cur) { delete state[cur]; after(); } });
  el('close').addEventListener('click', closePanel);

  Object.keys(tiles).forEach(function (id) {
    var t = tiles[id];
    t.addEventListener('click', function () { openPanel(id); });
    t.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openPanel(id); } });
  });

  function say(text) { el('msg').textContent = text; }
  function download(name, obj) {
    var text = JSON.stringify(obj, null, 1) + '\n';
    var url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    var a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    say(name + ' downloaded');
  }
  el('dl').addEventListener('click', function () { download('corrections.json', buildCorrections()); });
  el('dl-labels').addEventListener('click', function () { download('weapon_attach_labels.json', buildLabels()); });
  el('cp').addEventListener('click', function () {
    var text = JSON.stringify(buildCorrections(), null, 1) + '\n';
    function fallback() {
      var ta = el('raw'); ta.value = text; ta.focus(); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      say(ok ? 'copied' : 'select the JSON under the tiles and copy it by hand');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { say('copied'); }, fallback);
    } else { fallback(); }
  });

  // --- filters: the id search and the "No mount" chip (hosts that review reason mount_missing flags) --------------
  var onlyNoMount = false;
  function applyFilter() {
    var q = el('q').value.trim().toLowerCase();
    Object.keys(tiles).forEach(function (id) {
      var miss = !!q && id.toLowerCase().indexOf(q) < 0;
      var nm = onlyNoMount && !tiles[id].hasAttribute('data-nomount');
      tiles[id].classList.toggle('hide', miss || nm);
    });
    Array.prototype.forEach.call(document.querySelectorAll('details.family'), function (d) {
      var any = d.querySelector('.tile:not(.hide)');
      d.classList.toggle('hide', !any);
      if ((q || onlyNoMount) && any) { d.open = true; }
    });
  }
  el('q').addEventListener('input', applyFilter);
  el('f-nomount').addEventListener('click', function () {
    onlyNoMount = !onlyNoMount;
    el('f-nomount').setAttribute('aria-pressed', onlyNoMount ? 'true' : 'false');
    el('f-nomount').classList.toggle('on', onlyNoMount);
    applyFilter();
  });
  el('c-label').addEventListener('change', function () {
    document.body.classList.toggle('label-mode', el('c-label').checked);
    el('dl-labels').hidden = !el('c-label').checked;
    if (cur) { setPanelValues(tiles[cur]); }
  });

  render();
})();
</script>
</body>
</html>
