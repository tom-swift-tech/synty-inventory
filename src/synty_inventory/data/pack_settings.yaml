# Curated pack_id -> {setting, era} table for `synty-inventory pack-profile`
# (studio_pipeline_spec.md §4.3). Rule-derived pack_class/godot_ready/etc. are
# computed from the catalog directly; setting/era are not reliably inferable
# from asset-level fields alone, so they are hand-curated here, one entry per
# cataloged pack_id (`synty-inventory list-packs`). A pack missing from this
# table is a bug -- pack-profile refuses to guess and reports it, rather than
# silently emitting a wrong controlled-vocab value (see profile.py).
#
# Controlled vocab (spec §4.3):
#   setting: modern_city, scifi_city, scifi_frontier, space, fantasy,
#            post_apoc, military, western, horror, nature, generic
#   era: open low->high scale, not a closed enum in the spec. This table
#        uses: prehistoric, ancient, colonial, medieval, industrial, modern,
#        near_future, far_future. "modern" is the default era for packs
#        without a specific historical/futuristic setting (holiday, generic
#        utility, nature) -- era carries little signal for those and a human
#        override is expected to refine one if it ever matters.
#
# A pack's setting is its single strongest thematic signal, not an exhaustive
# tag list (that is what `role_counts`/`kit_families` are for). Ties are
# broken toward the more specific vocab entry (e.g. POLYGON_SciFi_Horror is
# `horror`, not `scifi_frontier` -- its differentiator is the derelict-horror
# treatment, not the sci-fi backdrop every SciFi_* pack shares).

