# A pack-id glob adds flags to every record of the pack. Mech-pack weapons are 4-5x hand scale: hold_class none.
pack_flags:
  POLYGON_Mech: [mech_scale]
  Mech: [mech_scale]
  '*_Mech': [mech_scale]

# Flags decided by the id alone (spec 3.4.5). Preset_* are prefab presets.
id_flags:
  - {flag: preset, id_regex: '(^|_)preset(_|\d|$)'}

# Family = lower-cased id minus trailing _NN and these suffix tokens (spec 3.4.4).
family_strip_tokens: [clean, rigged, unrigged, alt, optimised, separate, covered, preset]

# W7 (spec 3.5.2 PATCH R-H2): tool tokens whose HEAD leads (the blade, not the handle, is the working end), so the head
# sign replaces the pivot sign of a melee `tool` that carries one of them. Canonical (post-alias) lower-case tokens.
head_lead_tokens: [spade, shovel, pitchfork]

# W7 (spec 3.8 PATCH, read by the icon renderer): GLBs whose embedded texture is the wrong one; the albedo is taken from
# the Unity material instead. Each entry: name (unique), optional packs_any (pack-id globs), id_regex.
icon_albedo_from_material:
  - name: viking_shield_sets
    packs_any: ['POLYGON_Viking_Realm']
    id_regex: '^SM_Wep_Shield_Set_'

