# Exceptions to the table, first match wins; they need gear.twoHanded (spec 3.4.2). The spec lists smg under both
# one_hand ("twoHanded != true") and long_gun ("default"); read as: an smg is one_hand only when the catalog says
# twoHanded is explicitly false, otherwise long_gun.
hold_exceptions:
  - {name: smg_one_handed, archetypes: [smg], gear_two_handed: false, hold: one_hand}
  - {name: melee_two_handed, kind: melee, gear_two_handed: true, hold: melee_two}
  # needs a measured length, so it only fires in pass 2 (classify(measured=...))
  - {name: long_blade_two_handed, archetypes: [sword, axe, mace, hammer], min_length_m: 1.1, hold: melee_two}

# Genre fallback for packs whose setting does not decide it (generic, or absent from pack_settings.yaml)
