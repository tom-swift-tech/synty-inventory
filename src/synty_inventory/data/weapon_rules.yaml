# Weapon directory rules (docs/weapon_directory.md sections 3.4, 4.4). Human-edited, ordered, commented.
#
# Everything here is PATTERNS: token names, id regexes, enum values. No Synty content, no per-asset data
# (INV-1). Naming families the patterns are written against (see spec section 4.9):
#   SM_Wep_*       the confirmed weapon backbone       SM_Gen_Wep_*   shared tools, same mesh in many packs
#   Wep_*          un-prefixed bow/sword animation packs
#   SM_Prop_* / SM_Item_* / SM_Veh_* / SM_Env_*   real weapons mixed with scenery (the noisy bucket)
#   SM_Chr_Attach_*  holstered character props     Preset_*   prefab presets     Mod_*   modular gun parts
#
# How ids are matched: an asset id is split on "_" and camelCase, lower-cased, digits dropped, and run through
# token_aliases (so "SM_Wep_SubMGun_01" -> sm wep smg). Rules therefore use the CANONICAL (alias target) token
# only; the loader rejects a rule that names an alias variant, because it could never match.
#
# Every table below is first-match-wins. `weapons validate` fails (exit 6) if an entry is shadowed by an
# earlier one, and tests/test_weapons_classify.py checks each entry is the first match of >= 1 fixture id.
# When adding a rule, put it BEFORE any broader rule that would swallow it and add a fixture id.
version: 1

# canonical token -> variants that collapse to it. Variants are whole lower-cased "_" segments or the join of
# 2-3 neighbouring tokens (so Nail_Gun and NailGun both reach "nailgun").
token_aliases:
  smg: [submgun, submachinegun, machinepistol]
  lmg: [machinegun, lightmachinegun, mg]
  hmg: [heavymachinegun, chaingun]
  rpg: [rocketlauncher, bazooka]
  pistol: [handgun, sidearm]
  utilgun: [nailgun, paintgun, watergun, flaregun, spraygun, dartgun, staplegun, taser, welder, syringegun, gluegun, stungun]
  throwblade: [shuriken, kunai, throwingstar, throwingknife, throwingaxe]
  axe: [hatchet, tomahawk, battleaxe, waraxe, handaxe, fireaxe]
  sword: [katana, rapier, cutlass, machete, scimitar, saber, sabre, longsword, shortsword, greatsword, broadsword, straightsword, zweihander, ninjato, odachi, machette]
  knife: [dagger, shiv, tanto, kukri, razor, cleaver]
  mace: [flail, morningstar]
  club: [cudgel, baton, truncheon, nightstick, crowbar]
  hammer: [warhammer, maul, sledgehammer, mallet]
  spear: [pike, trident, harpoon, lance, javelin]
  polearm: [halberd, naginata, glaive, scythe, poleaxe, bardiche]
  staff: [quarterstaff]
  pickaxe: [pickacxe]  # the Wep_Pickacxe misspelling (W7)
  fistweapon: [knuckles, knuckleduster, claws, claw, tonfa, sai, cestus]
  bow: [longbow, shortbow, warbow, compoundbow]
  shield: [buckler, pavise, kiteshield, towershield]
  bomb: [molotov, dynamite, pipebomb, tnt, c4]
  mine: [landmine, ied]
  grenade: [flashbang]
  turret: [sentry]
  cannon: [artillery]
  siege: [catapult, trebuchet, ballista, batteringram, mangonel]
  mortar: [flak]
  cannonball: [cannonball, cannonballs]  # lets Cannon_Ball, CannonBall and CannonBalls reach the same token
  # W7b: the joined spellings FlameThrower / Flame_Thrower and ChainSaw / Chain_Saw reach the token (self-alias, as cannonball)
  flamethrower: [flamer, flamethrower]
  chainsaw: [chainsaw]
  shotgun: [blunderbuss]  # W7b
  stock: [gunstock]  # W7b
  optic: [scope, sight, ironsight, reddot, holo, acog, reflex, optics]
  magazine: [mag, clip, drum, mags]
  silencer: [suppressor]
  grip: [foregrip, vertgrip]
  bullet: [bullets, cartridge, casing]
  arrow: [arrows]

candidates:
  # Weapon-noun tokens (canonical, post-alias). The noisy `name_token` bucket is every asset id that carries one
  # of these; the exclude table below then removes the survey's false-positive families.
  nouns: &nouns
    - sword
    - knife
    - axe
    - mace
    - hammer
    - club
    - spear
    - polearm
    - staff
    - wand
    - whip
    - fistweapon
    - pickaxe
    - spade
    - shovel
    - wrench
    - chainsaw
    - pitchfork
    - torch
    - syringe
    - shield
    - bow
    - crossbow
    - arrow
    - bolt
    - quiver
    - sheath
    - scabbard
    - holster
    - pistol
    - revolver
    - rifle
    - carbine
    - shotgun
    - sniper
    - smg
    - lmg
    - hmg
    - minigun
    - gatling
    - rpg
    - launcher
    - flamethrower
    - utilgun
    - grenade
    - bomb
    - mine
    - claymore
    - throwblade
    - cannon
    - cannonball
    - turret
    - mortar
    - siege
    - gun
    - blaster
    - bullet
    - ammo
    - blade
    - weapon

  # An asset becomes a name_token candidate when the FIRST matching include entry fires (assets with a catalog
  # signal - type/semantic_role/gear.kind = weapon - are candidates without consulting this table).
  include:
    - name: veh_cannon          # SM_Veh_*Cannon*: vehicle-mounted guns (spec 3.4.1)
      match: {id_regex: '^SM_Veh_.*Cannon'}
    - name: prop_item_noun      # SM_Prop_/SM_Item_/SM_Env_/SM_Gen_/SM_Sign_ ... <weapon noun>
      match:
        id_regex: '^S[MA]_(Prop|Item|Veh|Env|Gen|Sign|Bld)_'
        tokens_any: *nouns
    - name: nonmesh_noun        # clips, UI sprites and FX that mention a weapon: kept only so they are audited
      match:
        asset_kind_any: [animation, ui, fx]
        tokens_any: *nouns
    - name: compound_substring  # one-word compounds the tokenizer cannot split (Windshield, Shieldwall, Launchpad)
      match: {id_contains_any: [shield, cannon, launcher]}

  # Rejections. Each entry carries a closed reason (EXCLUDE_REASONS). Order matters: the first match wins.
  # `nonplaceable` is applied in code after these, to anything still standing.
  exclude:
    - name: chr_attach          # holstered character props are wardrobe pieces (NB-4); restorable from review
      reason: character_attachment
      match: {id_regex: '^SM_Chr_Attach_'}
    - name: mech_weapon_attach  # Mech attachments and shared-body geo_* nodes are out of v1 (NB-3)
      reason: mech_attachment
      match: {id_regex: '^(SM_Mech_.*_Weapon_|geo_)'}
    - name: ui_kind
      reason: ui
      match: {asset_kind_any: [ui]}
    - name: ui_crosshair        # SM_Wep_Crosshair*: carries type=weapon through the Wep prefix
      reason: ui
      match: {tokens_any: [crosshair, reticle, hud]}
    - name: fx_prefix
      reason: fx
      match: {id_regex: '^(SM_)?(FX|VFX|PS)_'}
    - name: fx_kind
      reason: fx
      match: {asset_kind_any: [fx]}
    - name: ribbon_bow          # gift/ribbon bows are not archery
      reason: scenery
      match: {id_regex: '(ribbon|gift|present)_?bow|bow_?(ribbon|tie)'}
    - name: road_arrow          # road markings
      reason: scenery
      match: {id_regex: '(road|street|floor|ground|path|direction|lane)_?arrow|arrow_?(sign|marking)'}
    - name: mine_tunnel         # the mining kind of "mine"
      reason: scenery
      match: {id_regex: 'mine_?(tunnel|track|cart|shaft|entrance)|(tunnel|cart)_?mine'}
    - name: club_awning         # nightclub signage
      reason: scenery
      match: {id_regex: 'club_?(awning|sign|door|entrance|facade|house)'}
    - name: windshield          # contains "shield" but is glass
      reason: scenery
      match: {id_regex: 'windshield|windscreen'}
    - name: face_shield         # visors are headgear
      reason: scenery
      match: {id_regex: 'face_?shield|visor'}
    - name: weapon_rack_sign    # racks, shop signs and display stands named Weapon*
      reason: scenery
      match: {id_regex: 'weapons?_?(rack|sign|shop|store|stand|case|display|crate)|(rack|sign|stand|display)_?weapons?'}
    - name: grass_blade         # plant/machine blades
      reason: scenery
      match: {id_regex: '(grass|fan|rotor|turbine|propeller|wiper)_?blade'}
    - name: torch               # torches are lighting props, Wep-prefixed or not (NB-5)
      reason: tool_prop
      match: {tokens_any: [torch]}
    - name: nonwep_tool_prop    # pickaxe/spade/syringe PROPS; a Wep-prefixed pickaxe is archetype `tool` (NB-5)
      reason: tool_prop
      match:
        id_regex: '^S[MA]_(Prop|Env|Item|Gen)_'
        tokens_any: [pickaxe, spade, shovel, syringe, wrench, chainsaw, pitchfork]
        tokens_none: [wep]
    # --- W7 (spec 3.4.1 PATCH): scenery, furniture and whole characters that carry a weapon noun. They sit AFTER the
    # survey families on purpose: an older entry keeps every id it already caught (same reason, same `matched`); the order
    # inside the block matters (strip_club before bld_env_prefix, so SM_Bld_StripClub_* is named for the club) ---
    - name: strip_club          # the StripClub building and its props: the tokenizer splits it into strip + club
      reason: scenery
      match: {id_regex: 'strip_?club'}
    - name: bld_env_prefix      # building and environment pieces (mine towers, vents, ArrowSlit, Bomb, Planetary_Cannon)
      reason: scenery
      match: {id_regex: '^SM_(Bld|Env)_'}
    - name: chr_prefix          # whole character meshes (the Shieldmaidens); SM_Chr_Attach_ is caught above
      reason: character_attachment
      match: {id_regex: '^SM_Chr_'}
    - name: sign_prop           # arrow signs, nightclub signs; a Wep-prefixed Sign_Shield is an improvised shield
      reason: scenery
      match:
        id_regex: '^SM_(Prop|Sign|SignBorder)_'
        tokens_any: [sign]
        tokens_none: [wep]
    - name: container_furniture # gun cases, knife holders, weapon hangers, claw machines, crates, pike fences
      reason: scenery
      match:
        id_regex: '^SM_(Prop|Item)_'
        tokens_any: [crate, case, locker, holder, stand, hanging, hook, altar, display, machine, rack, arcade, box, fence]
        tokens_none: [ammo, bullet, arrow, quiver, magazine, shell, rocket, missile, wep]
    - name: pestle              # a mortar with a pestle is kitchenware, not artillery
      reason: scenery
      match: {tokens_any: [pestle]}

# Classification rules, FIRST MATCH WINS. Set is {role, kind?, archetype?, component?|carrier?|ammo?}; kind is
# derived from the archetype when omitted. `confidence` is the base (0.5-0.95), see spec 3.4.2 for the
# adjustments. Order is by specificity: carriers, ammo, gun parts and emplaced weapons come BEFORE whole
# weapons, because a part id carries the host gun's name (SM_Wep_Rifle_Scope_01 must not become a rifle).
rules:
  # --- carriers ---
  - {name: carrier_quiver, match: {tokens_any: [quiver]}, set: {role: carrier, carrier: quiver}, confidence: 0.92}
  - {name: carrier_sheath, match: {tokens_any: [sheath]}, set: {role: carrier, carrier: sheath}, confidence: 0.92}
  - {name: carrier_scabbard, match: {tokens_any: [scabbard]}, set: {role: carrier, carrier: scabbard}, confidence: 0.92}
  - {name: carrier_holster, match: {tokens_any: [holster]}, set: {role: carrier, carrier: holster}, confidence: 0.92}
  # --- loose ammunition ---
  - {name: ammo_arrow, match: {tokens_any: [arrow]}, set: {role: ammo, ammo: arrow}, confidence: 0.9}
  # "bolt" is also a rifle action (BoltAction): only a bolt WITHOUT those words is a crossbow bolt
  - name: ammo_bolt
    match: {tokens_any: [bolt], tokens_none: [action, rifle, sniper]}
    set: {role: ammo, ammo: bolt}
    confidence: 0.88
  # a rocket that is not a launcher is a loose projectile
  - name: ammo_rocket
    match: {tokens_any: [rocket, missile], tokens_none: [rpg, launcher]}
    set: {role: ammo, ammo: rocket}
    confidence: 0.88
  - {name: ammo_shell, match: {tokens_any: [shell]}, set: {role: ammo, ammo: shell}, confidence: 0.85}
  - {name: ammo_bullet, match: {tokens_any: [bullet, ammo]}, set: {role: ammo, ammo: bullet}, confidence: 0.9}
  - {name: ammo_cannonball, match: {tokens_any: [cannonball]}, set: {role: ammo, ammo: other}, confidence: 0.85}
  # --- modular gun parts (Mod_* and SM_Wep_<Gun>_<Part>) ---
  - {name: part_optic, match: {tokens_any: [optic]}, set: {role: part, component: optic}, confidence: 0.9}
  - {name: part_magazine, match: {tokens_any: [magazine]}, set: {role: part, component: magazine}, confidence: 0.9}
  - {name: part_stock, match: {tokens_any: [stock]}, set: {role: part, component: stock}, confidence: 0.9}
  - {name: part_barrel, match: {tokens_any: [barrel]}, set: {role: part, component: barrel}, confidence: 0.88}
  - {name: part_silencer, match: {tokens_any: [silencer]}, set: {role: part, component: silencer}, confidence: 0.9}
  - {name: part_bayonet, match: {tokens_any: [bayonet]}, set: {role: part, component: bayonet}, confidence: 0.9}
  - {name: part_rail, match: {tokens_any: [rail]}, set: {role: part, component: rail}, confidence: 0.88}
  - {name: part_trigger, match: {tokens_any: [trigger]}, set: {role: part, component: trigger}, confidence: 0.88}
  - {name: part_handguard, match: {tokens_any: [handguard]}, set: {role: part, component: handguard}, confidence: 0.9}
  - {name: part_grip, match: {tokens_any: [grip]}, set: {role: part, component: grip}, confidence: 0.88}
  - {name: part_body, match: {tokens_any: [body, receiver]}, set: {role: part, component: body}, confidence: 0.85}
  # Mod_<anything else>: a part, slot unknown
  - {name: part_misc, match: {tokens_any: [mod, flashlight, bipod, sling, attachment, muzzle, battery, tanks]}, set: {role: part, component: misc}, confidence: 0.8}
  # Veh/Heli/Jet/Tug attachments and the SM_Wep_Attach_* set mount on a vehicle or mech (W7); Heli_Attach_Missile and
  # Attach_Bolt are caught as ammo above
  - {name: part_attach, match: {tokens_any: [attach]}, set: {role: part, component: misc}, confidence: 0.85}
  # melee pieces of modular swords/axes use the same part vocabulary (slot misc)
  - {name: part_melee, match: {tokens_any: [hilt, pommel, crossguard, handle, guard]}, set: {role: part, component: misc}, confidence: 0.8}
  # --- emplaced (not hand-held); kind is ranged ---
  - {name: emplaced_turret, match: {tokens_any: [turret]}, set: {role: emplaced, archetype: turret}, confidence: 0.9}
  - {name: emplaced_siege, match: {tokens_any: [siege]}, set: {role: emplaced, archetype: siege_engine}, confidence: 0.9}
  - {name: emplaced_mortar, match: {tokens_any: [mortar]}, set: {role: emplaced, archetype: mortar}, confidence: 0.88}
  - {name: emplaced_cannon, match: {tokens_any: [cannon]}, set: {role: emplaced, archetype: cannon}, confidence: 0.85}
  # vehicle-mounted guns (Veh_Extra_Gun, Wep_Veh_*); a vehicle cannon stays `cannon` (W7). `tokens_none: [cannon]` is not
  # needed for the result (emplaced_cannon is first) but keeps the cannon rule from counting as an ambiguous second match,
  # which would cost every SM_Veh_*Cannon* a confidence step
  - name: emplaced_vehicle
    match: {tokens_any: [veh], tokens_none: [cannon]}
    set: {role: emplaced, archetype: turret}
    confidence: 0.8
  # --- whole ranged weapons, most specific first ---
  # a rocket/grenade LAUNCHER must precede the grenade rule: Grenade_Launcher carries both tokens
  - {name: launcher, match: {tokens_any: [rpg, launcher]}, set: {role: whole, archetype: launcher}, confidence: 0.93}
  - {name: flamethrower, match: {tokens_any: [flamethrower]}, set: {role: whole, archetype: flamethrower}, confidence: 0.93}
  - {name: heavy_gun, match: {tokens_any: [minigun, gatling, hmg]}, set: {role: whole, archetype: heavy_gun}, confidence: 0.92}
  - {name: lmg, match: {tokens_any: [lmg]}, set: {role: whole, archetype: lmg}, confidence: 0.92}
  - name: sniper
    match: {tokens_any: [sniper], tokens_none: [optic, ammo]}
    set: {role: whole, archetype: sniper}
    confidence: 0.92
  - {name: shotgun, match: {tokens_any: [shotgun]}, set: {role: whole, archetype: shotgun}, confidence: 0.93}
  - {name: revolver, match: {tokens_any: [revolver]}, set: {role: whole, archetype: revolver}, confidence: 0.93}
  - {name: smg, match: {tokens_any: [smg]}, set: {role: whole, archetype: smg}, confidence: 0.92}
  - {name: pistol, match: {tokens_any: [pistol]}, set: {role: whole, archetype: pistol}, confidence: 0.92}
  - {name: utility_gun, match: {tokens_any: [utilgun]}, set: {role: whole, archetype: utility_gun}, confidence: 0.88}
  - {name: rifle, match: {tokens_any: [rifle, carbine]}, set: {role: whole, archetype: rifle}, confidence: 0.9}
  # crossbow before bow: Crossbow ids may also carry "bow" through the alias table
  - {name: crossbow, match: {tokens_any: [crossbow]}, set: {role: whole, archetype: crossbow}, confidence: 0.93}
  - {name: bow, match: {tokens_any: [bow]}, set: {role: whole, archetype: bow}, confidence: 0.9}
  # --- thrown ---
  - {name: throwing_blade, match: {tokens_any: [throwblade]}, set: {role: whole, archetype: throwing_blade}, confidence: 0.9}
  # Claymore is a sword in the fantasy-style packs and a mine in the modern ones: decided by pack id glob
  - name: claymore_sword
    match: {tokens_any: [claymore], packs_any: ['*Fantasy*', '*Viking*', '*Samurai*', '*Pirate*', '*Ancient*', '*Kingdom*']}
    set: {role: whole, archetype: sword}
    confidence: 0.88
  - {name: grenade, match: {tokens_any: [grenade]}, set: {role: whole, archetype: grenade}, confidence: 0.92}
  - {name: bomb, match: {tokens_any: [bomb]}, set: {role: whole, archetype: bomb}, confidence: 0.9}
  - {name: mine, match: {tokens_any: [mine, claymore]}, set: {role: whole, archetype: mine}, confidence: 0.85}
  # --- melee ---
  - {name: sword, match: {tokens_any: [sword]}, set: {role: whole, archetype: sword}, confidence: 0.93}
  - {name: knife, match: {tokens_any: [knife]}, set: {role: whole, archetype: knife}, confidence: 0.93}
  - {name: axe, match: {tokens_any: [axe]}, set: {role: whole, archetype: axe}, confidence: 0.93}
  - {name: mace, match: {tokens_any: [mace]}, set: {role: whole, archetype: mace}, confidence: 0.93}
  - {name: hammer, match: {tokens_any: [hammer]}, set: {role: whole, archetype: hammer}, confidence: 0.92}
  - {name: club, match: {tokens_any: [club, bat]}, set: {role: whole, archetype: club}, confidence: 0.88}
  - {name: spear, match: {tokens_any: [spear]}, set: {role: whole, archetype: spear}, confidence: 0.93}
  - {name: polearm, match: {tokens_any: [polearm]}, set: {role: whole, archetype: polearm}, confidence: 0.92}
  - {name: staff, match: {tokens_any: [staff]}, set: {role: whole, archetype: staff}, confidence: 0.9}
  - {name: wand, match: {tokens_any: [wand]}, set: {role: whole, archetype: wand}, confidence: 0.9}
  - {name: whip, match: {tokens_any: [whip]}, set: {role: whole, archetype: whip}, confidence: 0.9}
  - {name: fist_weapon, match: {tokens_any: [fistweapon]}, set: {role: whole, archetype: fist_weapon}, confidence: 0.88}
  # Wep-prefixed improvised tools (the non-Wep props were excluded above)
  - name: tool
    match: {tokens_any: [pickaxe, spade, shovel, wrench, chainsaw, pitchfork]}
    set: {role: whole, archetype: tool}
    confidence: 0.85
  - {name: shield, match: {tokens_any: [shield]}, set: {role: whole, archetype: shield}, confidence: 0.93}
  # --- W7b: vocabulary the older rules did not know. They sit after every named archetype (so a Rifle_Preset or an
  # Assault_Shotgun keeps its own rule) and before generic_gun ---
  - {name: assault_rifle, match: {tokens_any: [assault]}, set: {role: whole, archetype: rifle}, confidence: 0.8}
  # Heavy_* in the SciFi_Worlds packs are heavy guns; a Heavy_*_Preset prefab is not told apart from other presets
  - name: heavy_gun_worlds
    match: {tokens_any: [heavy], tokens_none: [preset], packs_any: ['*SciFi_Worlds*']}
    set: {role: whole, archetype: heavy_gun}
    confidence: 0.75
  # Alien_* in the SciFi_Worlds packs are rifles; the same token elsewhere says nothing about the weapon
  - name: alien_gun
    match: {tokens_any: [alien], packs_any: ['*SciFi_Worlds*']}
    set: {role: whole, archetype: rifle}
    confidence: 0.7
  # every prefab preset in the survey lives under Prefabs/Weapons/Guns/: a preset whose gun the vocabulary does not know
  # is a ranged weapon of unknown archetype
  - {name: preset_gun, match: {tokens_any: [preset]}, set: {role: whole, kind: ranged, archetype: unknown}, confidence: 0.5}
  # --- last resort: it is a gun, which gun is unknown (kept for review, never dropped) ---
  - {name: generic_gun, match: {tokens_any: [gun, blaster]}, set: {role: whole, kind: ranged, archetype: unknown}, confidence: 0.5}

# Confidence for an id no rule matched (role whole, archetype unknown; kind from kind_hints or the measured fallback).
unknown_confidence: 0.2

# W7b (spec 3.4.2 PATCH W7b): kind for a whole/emplaced record that the rules left without one (archetype stays `unknown`).
# Canonical post-alias tokens, FAMILY-level vocabulary only (one entry names a family of ids, never one id). The lists are
# consulted in the order ranged, melee, thrown, and the first list that shares a token with the id wins; the loader rejects
# a token that sits in two lists. A token that already has a rule never needs an entry here (the rule sets the kind).
kind_hints:
  # laser/cutter/mining: sci-fi mining and cutting tools that fire (Laser_*, Plasma_Cutter_*, Mining_*); slingshot fires
  ranged: [laser, cutter, mining, slingshot]
  # shock/stick: stun batons (Shock_Stick); sickle/hacksaw/spanner/drill/surgical/scalpel: hand tools and blades;
  # charm/sceptre/scepter: ceremonial held pieces that are swung or pointed, never fired
  # W7b hand-check: a third of the measured `ranged` guesses on the live set were wrong. Their families are named here so
  # they never reach the guess: butcher (butcher tools), crutch, tongs, rammer/ram, saw, pipe, horn, golem (a golem arm or
  # club), pick, plank, trimmer, corkscrew are all held and swung or pressed, never fired
  melee: [shock, stick, sickle, hacksaw, spanner, drill, surgical, scalpel, charm, sceptre, scepter, butcher, crutch,
          tongs, rammer, ram, saw, pipe, horn, golem, pick, plank, trimmer, corkscrew]
  # loose throwables that are not grenades or bombs (those have rules); star = throwing stars, potato = a thrown potato
  thrown: [rock, stone, star, potato]

# W8a (docs/weapon_attachments.md 3.3): which `part` records are user-swappable attachments, and their {slot, kind}. It runs
# AFTER the part rules above, only for role part, and never changes `component`. Tokens here are RAW lower-case tokens of the
# id (split on `_` and camelCase, digits dropped, plus the joins of 2-3 neighbouring tokens so Red_Dot reaches `reddot`): the
# token_aliases step is NOT applied, because it folds scope/sight/reddot/reflex into one `optic` token and mag/drum/clip into
# `magazine`, which would erase the slot/kind distinction this table makes. `tokens_none` is the spec's `not_tokens`.
# `never`: a part matching ANY row is never an attachment (a vehicle accessory named like a laser), checked before `rows`.
# `rows`: first match wins; a part no row matches (rack and rail segments, carry handles without a scope, bayonets, stocks)
# keeps `attachment: null`.
attachment_rules:
  never:
    - {name: never_vehicle_token, match: {tokens_any: [veh, vehicle, heli, jet, tug]}}
    - {name: never_vehicle_pack, match: {packs_any: ['*Vehicle*', '*Vehicles*']}}
  rows:
    - {name: optic_sniper_scope, match: {tokens_all: [scope, sniper], tokens_none: [handle]}, set: {slot: optic, kind: sniper_scope}}
    - {name: optic_scope, match: {tokens_any: [scope], tokens_none: [handle, sniper]}, set: {slot: optic, kind: scope}}
    - {name: optic_carry_handle_scope, match: {tokens_all: [handle, scope]}, set: {slot: optic, kind: carry_handle_scope}}
    - {name: optic_reflex, match: {tokens_any: [redot, reddot, reflex, holo]}, set: {slot: optic, kind: reflex}}
    # Iron sights (A2, spec 3.3). `ironsight` is the joined token OR the pair iron+sight (classify.py adds the token `ironsight` to the
    # match context when both words are present, so each row is written once). The side comes from the NAME only: `front` and `post`
    # mark a front sight, `rear` a rear sight; a kind row precedes the plain row of its side (first match wins); the plain row has
    # kind `other`, which is not an unknown kind. A name with no side or with both sides matches no slot row and ends on the
    # `reason` row below (no slot, review reason sight_side_unsure).
    - {name: sight_front_canted, match: {tokens_all: [ironsight, canted], tokens_any: [front, post], tokens_none: [rear]}, set: {slot: sight_front, kind: canted}}
    - {name: sight_front_hood, match: {tokens_all: [ironsight, hood], tokens_any: [front, post], tokens_none: [rear]}, set: {slot: sight_front, kind: hooded}}
    - {name: sight_front_hooded, match: {tokens_all: [ironsight, hooded], tokens_any: [front, post], tokens_none: [rear]}, set: {slot: sight_front, kind: hooded}}
    - {name: sight_front_post, match: {tokens_all: [ironsight, post], tokens_none: [rear]}, set: {slot: sight_front, kind: post}}
    - {name: sight_front_plain, match: {tokens_all: [ironsight], tokens_any: [front, post], tokens_none: [rear]}, set: {slot: sight_front, kind: other}}
    - {name: sight_rear_canted, match: {tokens_all: [ironsight, rear, canted], tokens_none: [front, post]}, set: {slot: sight_rear, kind: canted}}
    - {name: sight_rear_aperture, match: {tokens_all: [ironsight, rear], tokens_any: [ring, aperture, peep], tokens_none: [front, post]}, set: {slot: sight_rear, kind: aperture}}
    - {name: sight_rear_notch, match: {tokens_all: [ironsight, rear, notch], tokens_none: [front, post]}, set: {slot: sight_rear, kind: notch}}
    - {name: sight_rear_plain, match: {tokens_all: [ironsight, rear], tokens_none: [front, post]}, set: {slot: sight_rear, kind: other}}
    - {name: muzzle_suppressor, match: {tokens_any: [silencer, suppressor]}, set: {slot: muzzle, kind: suppressor}}
    - {name: underbarrel_foregrip, match: {tokens_any: [foregrip, vertgrip]}, set: {slot: underbarrel, kind: foregrip}}
    - {name: underbarrel_bipod, match: {tokens_any: [bipod]}, set: {slot: underbarrel, kind: bipod}}
    - {name: laser_laser, match: {tokens_any: [laser], tokens_none: [mining]}, set: {slot: laser_light, kind: laser}}
    - {name: laser_light, match: {tokens_any: [flashlight, torch]}, set: {slot: laser_light, kind: light}}
    - {name: magazine_drum_joined, match: {tokens_any: [drummag]}, set: {slot: magazine, kind: drum}}
    - {name: magazine_drum_pair, match: {tokens_all: [drum, mag]}, set: {slot: magazine, kind: drum}}
    - {name: magazine_standard, match: {tokens_any: [mag, magazine], tokens_none: [cell]}, set: {slot: magazine, kind: standard}}
    - {name: magazine_cell, match: {tokens_any: [cell], tokens_none: [mining]}, set: {slot: magazine, kind: cell}}
    # Last on purpose: an iron-sight name no side row took (unmarked, or marked on both sides) keeps attachment null and gets the
    # review reason, confidence capped at 0.59 plus low_confidence. A row with `reason` sets no slot; classify_attachment skips it.
    - {name: sight_side_unsure, match: {tokens_all: [ironsight]}, reason: sight_side_unsure}
  # Host child meshes that fill a slot (docs/weapon_attachments.md 4.2; read by the W8b mount builder, not by W8a).
  child_tokens:
    optic: [scope, sight, reddot, redot, holo]  # a bare `sight` stays here: the live *_Sight_Glass children are optic glass (spec 4.2)
    sight_front: [frontsight, sightfront, ironsightfront, frontironsight]  # A2: sided names only; an unsided `Sights` child fills nothing
    sight_rear: [rearsight, sightrear, ironsightrear, rearironsight]
    magazine: [mag, magazine, drummag, cell, battery]
    underbarrel: [foregrip, bipod]
    laser_light: [laser, flashlight]
    muzzle: [silencer, suppressor, brake, compensator, flashhider]
  # Child names that never fill a slot, whatever else they contain.
  child_never: [trigger, slide, hammer, cylinder, pump, charge, handle, forestock, barrel, stock, switch, pin, clip]

  # Compatibility (docs/weapon_attachments.md 5.1, read by weapons/compat.py; W8c). Both tables live INSIDE attachment_rules on
  # purpose: that key is excluded from rules_digest (so the W7 default export stays byte-identical) and hashed into
  # attach_rules_digest (so an edit rebuilds directory.json). The thresholds of the spec (twin tolerance, fit_span cuts, the bore
  # tolerance) are named constants in compat.py; what is tunable lives here.
  # slot x kind -> the host archetypes that can carry it (this is where the genre knowledge lives; human-edited). `default`
  # covers the kinds of a slot that list no row (and `other`). A slot or kind without any row has no affinity.
  attach_affinity:
    optic:
      sniper_scope: [sniper, rifle, lmg, launcher]
      scope: [sniper, rifle, smg, lmg, shotgun, launcher]
      carry_handle_scope: [rifle, smg, lmg]
      reflex: [pistol, revolver, smg, rifle, shotgun, lmg, launcher, utility_gun]
      default: [pistol, revolver, smg, rifle, shotgun, sniper, lmg, launcher, utility_gun]
    muzzle:
      suppressor: [pistol, revolver, smg, rifle, shotgun, sniper, lmg, utility_gun]
      default: [pistol, revolver, smg, rifle, shotgun, sniper, lmg, utility_gun]
    underbarrel:
      foregrip: [smg, rifle, shotgun, sniper, lmg, heavy_gun, launcher]
      bipod: [sniper, rifle, lmg, heavy_gun]
      default: [smg, rifle, shotgun, sniper, lmg, heavy_gun]
    laser_light:
      laser: [pistol, revolver, smg, rifle, shotgun, utility_gun]
      light: [pistol, revolver, smg, rifle, shotgun, sniper, lmg, utility_gun]
      default: [pistol, revolver, smg, rifle, shotgun, utility_gun]
    # A2: the archetypes of the former optic.iron row
    sight_front:
      default: [pistol, revolver, smg, rifle, shotgun, sniper, lmg, utility_gun]
    sight_rear:
      default: [pistol, revolver, smg, rifle, shotgun, sniper, lmg, utility_gun]
    magazine:
      standard: [pistol, revolver, smg, rifle, shotgun, sniper, lmg, utility_gun]
      extended: [pistol, smg, rifle, shotgun, sniper, lmg, utility_gun]
      drum: [smg, rifle, shotgun, lmg]
      cell: [pistol, smg, rifle, lmg, heavy_gun, launcher, utility_gun]
      default: [pistol, revolver, smg, rifle, shotgun, sniper, lmg, utility_gun]
  # Score parameters (spec 5.1: "initial values are parameters, not contract"). A candidate's score is `base` of its tier plus
  # the fit signals, clamped to the band of its tier (same_pack_fit 0.6-0.9, cross_pack_fit 0.3-0.6); override and twin are
  # fixed. `generic_tokens` are dropped from both names before `family_overlap` (numbers are dropped by the tokenizer).
  attach_compat:
    tier_score: {override: 1.0, twin: 0.95}
    base: {same_pack_fit: 0.7, cross_pack_fit: 0.4}
    fit_span_bonus: 0.1
    fit_bore_bonus: 0.1
    fit_bore_penalty: 0.1
    # Magazines (A6, 13.7 A6-3). drum_min_m: a magazine whose smaller body side (min of footprint length and width) reaches it reads the `drum` row of
    # attach_affinity, whatever its name or kind (the record's kind is unchanged). fit_span_min: a non-twin, non-override magazine whose foot is
    # shorter than this fraction of the host's well (foot_length_m / span_m) is not listed, whatever the span's source; twin and override tiers are
    # never touched, and a pair without a span or a foot length is not judged.
    drum_min_m: 0.11
    fit_span_min: 0.75
    # Cross-pack size gate (A7-2 R-a, 13.8): a cross_pack_fit pair on one of these slots whose seat names a baked child with recorded extents is dropped
    # (listed or pending) when max over the three sorted extents of |part / child - 1| exceeds the slot's number. Never twin, override or same_pack_fit;
    # a slot absent here, or a host with no recorded child, is not checked. These were set on Tom's draw #1 and draw #2 labels (the largest labelled
    # yes is 0.33 for magazine and optic, 0.38 for underbarrel), so they are FITTED, not validated: the control strata of draw #3 (A7-5) are the
    # out-of-sample check. The same numbers gate the tokenless waiver below (A7-4).
    cross_pack_size_tol: {magazine: 0.35, optic: 0.35, underbarrel: 0.45}
    # Unverified cross-pack slots (A8-1, 13.9; Tom 2026-10-26, draw #3: cross magazines 6 of 12 yes, R-a cannot separate them): a cross_pack_fit pair on
    # one of these slots is routed to pending_hosts ({host, tier}) after R-a, R-b, R-c and the A6 foot test. The directory keeps it and a game opts in
    # with `--pending-min-tier cross_pack_fit`. Optic, muzzle and underbarrel stay listed. Empty or absent = nothing moves.
    cross_pack_unverified_slots: [magazine]
    generic_tokens: [wep, sm, attachment, attach, separate, mod, accessory, part, small, medium, med, large, big, huge, tiny,
                     mini, long, short, left, right, front, rear, top, bottom, alt, clean]
  # Setting gate (A2, spec 5.1): full pack id -> setting word. A candidate that is not an override needs the part's pack and the host's
  # pack in ONE setting; a pack absent from this map is a setting of its own (matches only itself). This is not the record `genre`
  # (pack_settings.yaml). It lives inside attachment_rules, so editing it moves attach_rules_digest and never rules_digest.
  attach_genre_by_pack:
    POLYGON_Military: modern
    POLYGON_BattleRoyale: modern
    POLYGON_Police_Station: modern
    POLYGON_Heist: modern
    POLYGON_Shops: modern
    POLYGON_Palm_City: modern
    POLYGON_Gang_Warfare: modern
    POLYGON_Spy_Kit: modern
    POLYGON_Town: modern
    POLYGON_City: modern
    POLYGON_Military_Warehouse_Map: modern
    POLYGON_Apocalypse: apocalypse
    POLYGON_Apocalypse_Wasteland: apocalypse
    POLYGON_SciFi_City: scifi
    POLYGON_SciFi_Worlds: scifi
    POLYGON_CyberCity: scifi
    POLYGON_SciFi_Horror: scifi
    POLYGON_SciFi_Space: scifi
    POLYGON_SciFi_Outpost_Map: scifi
    POLYGON_War: historical
    POLYGON_Pirate: historical
    POLYGON_War_Map: historical
  # Sight seat probe (A2, spec 4.6; parameters, not contract). 5 mm bins along host forward; a bin's height is the highest `up` of
  # the vertices within max(side_min_m, side_frac x side extent) of the centre; the receiver run is the bins within receiver_tol_m
  # of the highest bin, the rail run continues it forward within rail_tol_m; the seats sit rear_inset_m inside the receiver run's
  # rear end and front_inset_m inside the rail run's front end; fewer than min_receiver_bins, or a front seat less than
  # min_separation_m ahead of the rear seat, refuses both seats.
  sight_probe:
    bin_m: 0.005
    receiver_tol_m: 0.006
    rail_tol_m: 0.030
    rear_inset_m: 0.010
    front_inset_m: 0.008
    min_receiver_bins: 3
    min_separation_m: 0.060
    side_min_m: 0.008
    side_frac: 0.10
    # added by the live gates of 4.6 item 6: the side centre is the median side coordinate of the surface within ridge_tol_m of the
    # highest point (not the middle of the bounding box, which a stock or a side pouch skews off the barrel line); a seat's height
    # is the median of up to five vertical rays (the seat and the points seat_ray_m ahead, behind and to each side), and a seat whose
    # three rays along the bore miss the host, or whose hits spread over seat_flat_tol_m (a cliff or a hole under it), refuses the host.
    ridge_tol_m: 0.008
    seat_ray_m: 0.003
    seat_flat_tol_m: 0.006
    # A6 (W8n, 13.7 A6-4 d2): the receiver tolerance of the named hosts only (every other host keeps receiver_tol_m). Key: "<pack>/<host id>" exactly as in
    # the directory. SM_Wep_SubMGun_01 carries a row of tooth crests 11 mm above its deck, so at 6 mm the receiver run is the teeth and the rear seat lands
    # 30 mm forward of the deck's rear end; 14 mm (crest to deck 11 mm plus margin) reaches the deck. 0.014 is an estimate the lead verifies on the mesh.
    receiver_tol_by_host:
      POLYGON_Apocalypse/SM_Wep_SubMGun_01: 0.014
  # Hosts that get no seat for a slot (A3, spec 7). slot -> host name tokens; the host's tokens are those of its asset id (the id after the
  # pack, split like the family_overlap tokens, plus the joins of neighbouring tokens, so Flare_Gun reaches `flaregun`). A host with one of
  # them gets that slot's mount `none` / `slot_disabled`, so the slot veto of compat.py removes every candidate that is not an override.
  # Flare guns and props: the A2 look gate showed sights on top of a briefcase and high on a flare-gun block. Inside attachment_rules,
  # so editing it moves attach_rules_digest and never rules_digest.
  # Addendum 3 (W8j, spec 4.6 item 8 E): the slot `optic` may be named as well. The toy and water guns carry tanks and housings on top, so
  # they take no optic and no sight; the mount is `none` / `slot_disabled` whatever its source (a baked scope child included). An id override wins.
  # Addendum 5 (item 0): a prop (SM_Prop_Briefcase_Flaregun_01 is a briefcase) takes no attachment at all, so `prop` names every slot; the
  # briefcase listed silencers, a flashlight and six magazines before. The flare, water and toy tokens keep their slots.
  # A8 erratum (2026-10-26): `flare` alone is a tool token, so Pistol_Flare_01 is refused every slot like the flare gun; word order was the bug.
  # The flare tokens below stay in sight_front / sight_rear (the class union covers the rest).
  attach_host_never:
    optic: [water, watergun, toy, prop]
    sight_front: [flare, flaregun, prop, water, watergun, toy]
    sight_rear: [flare, flaregun, prop, water, watergun, toy]
    muzzle: [prop]
    underbarrel: [prop]
    magazine: [prop]
    laser_light: [prop]
  # Host classes (A6, 13.7 A6-1). attach_host_class: class -> host name tokens (the tokenizer of attach_host_never: lower-case words of the host id after
  # the pack and their joins of 2-3 neighbours); a host in no class is a firearm. attach_class_never: class -> the slots the class refuses, each a mount
  # `none` / `slot_disabled` exactly like attach_host_never (their union applies; an id override still beats a disabled slot). Inside attachment_rules:
  # moves attach_rules_digest, never rules_digest.
  #   launcher  stop trying to put attachments on launchers (Tom, 2026-10-24: muzzle, and "No optics on launchers"): muzzle and optic are refused (the
  #             muzzle affinity row omits `launcher` already; this survives an edit of that row). Foregrips on a launcher stay.
  #   tool      a nail gun is a tool, not a firearm: nothing attaches to it. Tom, 2026-10-24: flame throwers, flare guns and stun guns get "Nothing, like
  #             the nail gun", so their tokens are in this class (flamethrower, flamer, flame, flaregun, stungun).
  #             A8 erratum (2026-10-26): `flare` alone is a tool token, so Pistol_Flare_01 is refused every slot like the flare gun; word order was the bug.
  #   fixed_heavy  Tom, 2026-10-24: "minigun doesn't take any attachments": every slot is refused (a minigun is not a tool, so it has its own class).
  #   attach_filled_hosts (Tom, 2026-10-24: "presets only refuse the slots their built-in parts already fill; other slots stay open"): host name tokens
  #             of hosts that arrive with their parts on (a Preset_* prefab). Such a host refuses each slot one of its own baked children fills (the
  #             measured children decide, so no preset is listed by hand); every slot no child fills stays open.
  attach_filled_hosts: [preset]
  #   attach_filled_open (Tom, 2026-10-24: "preset guns can take other magazines (size rule still applies). Keep refusing extra scopes and sights where
  #             one is built in"): the slots that stay open on such a host although a baked child fills them. The baked magazine is hidden through
  #             occupied_by (W8g) where another one seats, and the foot-length fit decides; optic, sights and the other filled slots stay refused.
  attach_filled_open: [magazine]
  attach_host_class:
    launcher: [launcher, rpg, rocket, missile]
    fixed_heavy: [minigun]
    tool: [nailgun, nail, glue, paint, syringe, welder, water, watergun, waterpistol, flamethrower, flamer, flame, flare, flaregun, stungun]
  attach_class_never:
    launcher: [muzzle, optic]
    fixed_heavy: [muzzle, optic, underbarrel, magazine, laser_light, sight_front, sight_rear]
    tool: [muzzle, optic, underbarrel, magazine, laser_light, sight_front, sight_rear]
  # Baked iron sights (A3, spec 4.6 item 7). A host child whose name (minus the host's own name tokens) has a token of `tokens` and none
  # of `not_tokens`, or one of `rear_tokens`, is an iron sight the gun already carries. A child that names its side (the sided child_node
  # of child_tokens) is one too. `Sight_Glass`, a scope or red-dot part and a ChargeHandle (tokens charge, handle) are not baked iron sights.
  # Addendum 3 (W8j, item 8): the same table also classifies the optics a host carries (all name tokens, whole words):
  #   glass_tokens   a glass child, judged on the child's FULL name (Scope_Glass_01 is glass); a 3 mm sheet whose optic body is fused into the host.
  #   body_tokens    an optic body child (no glass token): a real node, so it can be hidden under the optic hide path.
  #   handle_tokens  a carry handle child: a handle token and none of handle_not_tokens, whose centre lies above handle_min_height_frac of the
  #                  host's extent along `up` (lower is a grip or a lever). rear_tokens (carryhandle, carry) stay carry handles at any height.
  #   fused_post     the fused front post detector (D) on the probe mesh: bins of bin_m along forward, a bin's baseline is the median of the
  #                  populated bins within half_bins BIN INDICES of it, a bin hits when it stands rise_m over its baseline, a run of hits (one empty
  #                  bin bridged) of width_min_m..width_max_m whose centre lies at min_pos or more of the host's forward extent is a fused post.
  # Rules (item 8, applied after the mounts resolve; an override mount is never touched, a slot already `none` keeps its reason):
  #   A body child -> sight_front and sight_rear `none` / `slot_disabled`, optic unchanged.   B glass-only host -> optic and both sights.
  #   C a baked front post, rear sight or carry handle (child or fused) -> BOTH sight slots (only those the probe seated).
  # Inside attachment_rules, like the tables above: they move attach_rules_digest and never rules_digest.
  baked_sights:
    tokens: [sight, sights, ironsight, ironsights]
    not_tokens: [glass, scope, lens, reticle, laser, red, dot]
    rear_tokens: [carryhandle, carry]
    glass_tokens: [glass, lens, reticle]
    body_tokens: [scope, optic, optics, acog, telescope, reddot, reflex, holo, holosight]
    handle_tokens: [handle]
    handle_not_tokens: [charge, pump, bolt, cocking, trigger]
    handle_min_height_frac: 0.55
    fused_post:
      bin_m: 0.005
      half_bins: 8
      rise_m: 0.008
      width_min_m: 0.010
      width_max_m: 0.030
      min_pos: 0.6
  # Anchor measurement (A4, W8l, spec 3.4 steps 1a and 3b; read by weapons/attach.py, parameters not contract). Inside attachment_rules, like the
  # tables above: it moves attach_rules_digest and never rules_digest.
  #   foot_depths_m  the rungs of the foot slab: the first is the 4 mm slab of step 1, the others are tried when a slab only cut a LIP.
  #   lip_min_m, lip_max_m, lip_growth  a slab extent (along forward or right) is a lip when it is within lip_min_m .. lip_max_m (a line contact
  #                  of extent 0 is no lip) and the next rung is at least lip_growth times as large on that axis; while any axis is a lip the next rung
  #                  is used, so at most len(foot_depths_m) - 1 steps. A thin foot that stays thin (an iron-sight post) is a foot.
  #   free_end       slot -> kinds whose forward sign comes from where the free end (the outer 25 % along up, away from the foot) sits against the
  #                  foot along the long horizontal axis, when that displacement is at least min_displacement_m (step 3b; a banana magazine leans
  #                  toward the muzzle). Not generic: an optic's free end is its top, a drum and a foregrip have no ground truth.
  anchor:
    foot_depths_m: [0.004, 0.008, 0.016]
    lip_min_m: 0.001
    lip_max_m: 0.0045
    lip_growth: 2.0
    free_end:
      min_displacement_m: 0.010
      kinds:
        magazine: [standard]
        underbarrel: [bipod]
  # Slots whose same_pack_fit candidate needs no family_overlap (A4, spec 5.1): the part names no gun. laser_light (no labelled pair yet), magazine
  # and optic (their names carry the family) are left out on purpose. Inside attachment_rules: moves attach_rules_digest, never rules_digest.
  family_free_slots: [sight_front, sight_rear, muzzle, underbarrel]
  # A7-4 (13.8): a part with NO name tokens (every word generic) can never share a family token with a host. On these slots it passes the same_pack_fit
  # family test anyway, but only when the host seat is a baked child (child_node) and the part is within cross_pack_size_tol of that child. A pair without
  # a seat is neither listed nor pending; magazine and laser_light stay out. Remove the row to withdraw the waiver (draw #3 does the check).
  tokenless_family_free_slots: [optic]
  # A8-2 R-c (13.9; A7's cross_pack_never, renamed and made symmetric): slot -> host archetypes on which a part of kind `suppressor` is vetoed at EVERY tier
  # (twin, same_pack_fit and cross_pack_fit, listed and pending) except `override` (a compatible.add names the pair by hand). Brakes, compensators and flash
  # hiders are not suppressors and are untouched. The kind is fixed to `suppressor` by the spec, there is no key for it. Empty or absent = no rule.
  suppressor_never:
    muzzle: [shotgun]
  # Settle to contact (A5, spec 5.4): the parts of these slots get a per-pair `seat_shift_m` on their compatible_hosts entries, found by casting the
  # part's contact face (the 4 mm slab at its extreme, sampled every 2.5 mm) onto the host's outer surface along the mount's up. A pair within dead_m
  # (3 mm) of the surface is left alone, a bigger offset is closed up to clamp_m, a host surface further than reach_m is ignored. Inside
  # attachment_rules: moves attach_rules_digest, never rules_digest.
  contact:
    slots: [optic, underbarrel]
    slab_m: 0.004
    pitch_m: 0.0025
    dead_m: 0.003
    clamp_m: 0.060
    reach_m: 0.5
    # A6 (W8n, 13.7 A6-4): an optic or underbarrel pair settled more than cap_m off the host (|seat_shift_m| over it) is not listed (not pending either): the
    # seat of that host is wrong by more than a part's own foot can excuse. Twin and override entries carry no key, so they are never affected.
    cap_m: 0.030
  # Silencer seat (A6, 13.7 A6-2): a suppressor on a PROBE muzzle mount with nothing baked on it (not twin, not override) starts at the barrel tip, which
  # leaves a built-in brake, flash hider or shroud stub exposed behind it, so the pair gets `seat_setback_m`, a set-back along the bore (toward the
  # host). The host mesh (collision nodes and the mount's occupied_by nodes dropped) is sampled every sample_pitch_m; within range_m behind the tip (and
  # 100 mm ahead) and radius_cap_m of the bore a silhouette radius per bin_m of the axis is taken. r_ref is the thinnest sustained radius (the minimum over
  # 10-bin windows of the window median, windows of fewer than 5 populated bins skipped) in the last window_m. A bin is wide when it exceeds ref_ratio * r_ref.
  # Walking back from the tip, runs of wide bins (one empty or narrow bin does not split a run; a run of fewer than run_min_bins bins is noise and
  # ignored) shorter than device_max_m are DEVICES (brake, hider, gas
  # block, stud); the first run of device_max_m or more is the shroud and ends the walk: stub = its front distance from the tip. Without one, stub = the
  # rearmost device's rear distance + 10 mm, or 0 with no device. dev_rear_near = the largest rear distance among devices within device_reach_m of the tip
  # (a brake; a device further back is a gas block or sling stud and must not pull the sleeve over it).
  # d = min(stub, max(cover * L, dev_rear_near + device_cover_m), max_frac * L), L = the part's length along the bore (footprint.height_m); a d of dead_m or
  # less writes no key.
  muzzle_seat:
    cover: 0.4
    device_cover_m: 0.005
    device_reach_m: 0.080
    max_frac: 0.75
    dead_m: 0.003
    window_m: 0.15
    bin_m: 0.002
    ref_ratio: 1.4
    run_min_bins: 3
    device_max_m: 0.045
    sample_pitch_m: 0.0015
    range_m: 0.30
    radius_cap_m: 0.035

